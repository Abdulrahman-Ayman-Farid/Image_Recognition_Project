# ExternalSecret that syncs JUPYTER_TOKEN and DB_URL from the Vault path
# "image-recognition" into a Kubernetes Secret. The target secret name
# "image-recognition-secrets" matches the deployment's envFrom secretRef,
# so the synced values are automatically injected as environment variables
# into the image-recognition pods.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: image-recognition-secrets
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: "vault-secret-store"
    kind: "ClusterSecretStore"
  target:
    name: "image-recognition-secrets"
    creationPolicy: "Owner"
  data:
    - secretKey: "JUPYTER_TOKEN"
      remoteRef:
        key: "image-recognition"
        property: "jupyter_token"
    - secretKey: "DB_URL"
      remoteRef:
        key: "image-recognition"
        property: "db_url"
