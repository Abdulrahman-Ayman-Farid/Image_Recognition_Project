# ClusterSecretStore for External Secrets Operator (ESO).
# This store fetches secrets from HashiCorp Vault using Kubernetes authentication.
# The Vault server URL, role, and service account below must be configured to
# match the actual Vault deployment before applying this manifest.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-secret-store
spec:
  provider:
    vault:
      # NOTE: Replace this placeholder with the real Vault server address.
      server: "https://vault.example.com"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "image-recognition-role"
          serviceAccountRef:
            name: "external-secrets-sa"
            namespace: "external-secrets"
